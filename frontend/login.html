
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartQueue | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f3f6fb;
            font-family: Arial, sans-serif;
        }
        .auth-card {
            width: min(440px, 94vw);
            padding: 32px;
            border: 0;
            border-radius: 18px;
            box-shadow: 0 12px 36px #17255412;
        }
        .brand { color: #2457d6; font-weight: 800; }
        .form-control { padding: 12px; }
        .btn-primary { padding: 12px; }
    </style>
</head>
<body>
<main class="card auth-card">
    <h2 class="brand mb-1">SmartQueue</h2>
    <p class="text-secondary mb-4">Sign in to your portal</p>

    <div id="message" class="alert d-none" role="alert"></div>

    <form id="loginForm">
        <h5 class="mb-3">Welcome back</h5>

        <label for="loginEmail" class="form-label">Email</label>
        <input id="loginEmail" class="form-control mb-3"
               type="email" required autocomplete="username">

        <label for="loginPassword" class="form-label">Password</label>
        <input id="loginPassword" class="form-control mb-3"
               type="password" required autocomplete="current-password">

        <button id="loginButton" class="btn btn-primary w-100" type="submit">
            Sign in
        </button>
    </form>

    <hr class="my-4">

    <form id="registerForm">
        <h5>Create a customer account</h5>

        <label for="registerName" class="form-label">Full name</label>
        <input id="registerName" class="form-control mb-3"
               required maxlength="100" autocomplete="name">

        <label for="registerEmail" class="form-label">Email</label>
        <input id="registerEmail" class="form-control mb-3"
               type="email" required autocomplete="email">

        <label for="registerPassword" class="form-label">Password</label>
        <input id="registerPassword" class="form-control mb-3"
               type="password" minlength="8" required
               autocomplete="new-password">

        <button id="registerButton"
                class="btn btn-outline-primary w-100" type="submit">
            Register as customer
        </button>
    </form>

    <p class="small text-secondary mt-3 mb-0">
        Staff accounts are created by the system administrator.
    </p>
</main>

<script src="auth.js"></script>
</body>
</html>
